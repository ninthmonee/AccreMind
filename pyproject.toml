[project]
name = "accremind-workspace"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
  "backend/apps/api",
  "backend/apps/cli",
  "backend/apps/worker",
  "backend/apps/mcp_gateway",
  "backend/packages/retriever_agent",
  "backend/packages/model_providers",
  "backend/packages/contracts",
  "backend/packages/experience_domain",
  "backend/packages/static_experience",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
