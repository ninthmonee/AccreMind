services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: accremind
      POSTGRES_USER: accremind
      POSTGRES_PASSWORD: accremind
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accremind -d accremind"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - accremind-postgres:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  accremind-postgres:
