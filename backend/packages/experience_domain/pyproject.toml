[project]
name = "accremind-experience-domain"
version = "0.1.0"
description = "Domain rules and state machines for AccreMind experiences"
requires-python = ">=3.12"
dependencies = ["accremind-contracts"]

[tool.uv.sources]
accremind-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accremind_experience_domain"]

