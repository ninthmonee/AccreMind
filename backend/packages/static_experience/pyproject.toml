[project]
name = "accremind-static-experience"
version = "0.1.0"
description = "Static experience import and conversion for AccreMind"
requires-python = ">=3.12"
dependencies = ["accremind-contracts", "PyYAML>=6.0,<7"]

[tool.uv.sources]
accremind-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accremind_static_experience"]
