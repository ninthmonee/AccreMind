[project]
name = "accremind-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["accremind-api", "celery[redis]>=5.6,<6"]
[tool.uv.sources]
accremind-api = { workspace = true }
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/accremind_worker"]
