[project]
name = "accremind-mcp-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["accremind-contracts", "mcp>=2,<3", "httpx>=0.28,<1"]
[tool.uv.sources]
accremind-contracts = { workspace = true }
[project.scripts]
accremind-mcp = "accremind_mcp_gateway.server:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/accremind_mcp_gateway"]
