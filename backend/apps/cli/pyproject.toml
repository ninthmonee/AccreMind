[project]
name = "accremind-cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["accremind-contracts", "accremind-static-experience", "httpx>=0.28,<1", "typer>=0.16,<1"]
[tool.uv.sources]
accremind-contracts = { workspace = true }
accremind-static-experience = { workspace = true }
[project.scripts]
accremind = "accremind_cli.main:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/accremind_cli"]
