[project]
name = "accremind-api"
version = "0.1.0"
description = "AccreMind Core API"
requires-python = ">=3.12"
dependencies = [
  "accremind-contracts",
  "accremind-retriever-agent",
  "accremind-model-providers",
  "pgvector>=0.4,<1",
  "accremind-static-experience",
  "accremind-experience-domain",
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[tool.uv.sources]
accremind-retriever-agent = { workspace = true }
accremind-model-providers = { workspace = true }
accremind-contracts = { workspace = true }
accremind-static-experience = { workspace = true }
accremind-experience-domain = { workspace = true }

[project.scripts]
accremind-api = "accremind_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accremind_api"]

