<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 研发知识基座 · 可交互原型</title>
<style>
/* ==========================================================================
   AI 研发知识基座 · 可交互原型
   设计系统：Ant Design 6 —— 纯 CSS 变量范式，token 值对齐官方 Seed/Alias Token
   --------------------------------------------------------------------------
   与 Ant Design 4 范式的核心差异（本轮重构依据）：
     colorPrimary   #1890ff → #1677ff
     borderRadius   2px      → 6px（卡片 8 / 小组件 4）
     colorBgLayout  #F0F2F5  → #f5f5f5（去蓝灰，转中性灰）
     colorText      .85      → .88
     侧边栏          深色 #001529 → 浅色 #fff（现代 AntD Pro 已移除 navTheme）
     多页签栏        v4 范式的 tags-view → 移除（Pro 6 默认 multiTab=false，业界已弃用）
     阴影            单层     → 三层叠加
     间距            随手值   → 4 / 8 / 12 / 16 / 24 网格
     主色用途        装饰     → 仅表「可交互 / 选中」
   ========================================================================== */
:root{
  /* ---- Seed Tokens（官方默认值） ---- */
  --pri:#1677ff;                    /* colorPrimary */
  --pri-h:#4096ff;                  /* colorPrimaryHover */
  --pri-a:#0958d9;                  /* colorPrimaryActive */
  --pri-bg:#e6f4ff;                 /* colorPrimaryBg */
  --pri-line:#91caff;               /* colorPrimaryBorder */
  --pri-dk:#003eb3;                 /* colorPrimaryTextActive */
  --ok:#52c41a; --ok-bg:#f6ffed; --ok-line:#b7eb8f; --ok-dk:#389e0d; --ok-a:#237804;
  --wrn:#faad14; --wrn-bg:#fffbe6; --wrn-line:#ffe58f; --wrn-dk:#d48806; --wrn-a:#ad6800;
  --dgr:#ff4d4f; --dgr-bg:#fff2f0; --dgr-line:#ffccc7; --dgr-dk:#cf1322; --dgr-a:#a8071a;
  --pur:#722ed1; --pur-bg:#f9f0ff; --pur-line:#d3adf7; --pur-dk:#531dab;
  --neu:#8c8c8c; --neu-bg:#fafafa; --neu-line:#d9d9d9;

  /* ---- Alias Tokens（语义化） ---- */
  --panel:#ffffff;                  /* colorBgContainer */
  --panel-2:#fafafa;                /* colorFillQuaternary */
  --elev:#ffffff;                   /* colorBgElevated */
  --canvas:#f5f5f5;                 /* colorBgLayout */
  --fill:#f5f5f5;                   /* colorFillTertiary */
  --fill-2:rgba(0,0,0,.04);         /* colorFillQuaternary */
  --line:#d9d9d9;                   /* colorBorder —— 仅用于输入类控件边框 */
  --line-2:#f0f0f0;                 /* colorBorderSecondary —— 分割线主色 */
  --line-3:#f5f5f5;                 /* colorSplit 更轻一层 */
  --t1:rgba(0,0,0,.88);             /* colorText */
  --t2:rgba(0,0,0,.65);             /* colorTextSecondary */
  --t3:rgba(0,0,0,.45);             /* colorTextTertiary */
  --t4:rgba(0,0,0,.25);             /* colorTextQuaternary */

  /* ---- 侧边栏（浅色，跟随现代 Ant Design Pro） ---- */
  --sd:#ffffff;
  --sd-t:rgba(0,0,0,.65);
  --sd-t-on:#1677ff;
  --sd-on-bg:#e6f4ff;
  --sd-line:#f0f0f0;
  --sd-hover:rgba(0,0,0,.04);

  /* ---- 度量 ---- */
  --r:6px;    /* borderRadius */
  --rs:4px;   /* borderRadiusSM */
  --rl:8px;   /* borderRadiusLG */
  --sd-w:248px; --sd-w-c:64px;
  --pbar-h:40px; --hd-h:56px; --proof-h:42px;

  /* ---- 阴影（AntD 三层叠加，禁止单层） ---- */
  --sh:0 1px 2px 0 rgba(0,0,0,.03),0 1px 6px -1px rgba(0,0,0,.02),0 2px 4px 0 rgba(0,0,0,.02);
  --sh2:0 6px 16px 0 rgba(0,0,0,.08),0 3px 6px -4px rgba(0,0,0,.12),0 9px 28px 8px rgba(0,0,0,.05);
  --sh1:0 1px 2px 0 rgba(0,0,0,.03),0 1px 6px -1px rgba(0,0,0,.02),0 2px 4px 0 rgba(0,0,0,.02);
  --sh-btn:0 2px 0 rgba(0,0,0,.015);
  --sh-btn-pri:0 2px 0 rgba(5,145,255,.08);
  --sh-dgr:0 2px 0 rgba(255,38,5,.05);
  --mono:SFMono-Regular,Consolas,'Liberation Mono',Menlo,Courier,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh}
/* 注意：body 不可写 height:100% ——
   那会把 body 高度锁在视口高，使 .pbar 的 sticky 包含块只有一屏高，滚动即失效。 */
body{background:var(--canvas);color:var(--t1);font-size:14px;line-height:1.5714;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Hiragino Sans GB',
  'Microsoft YaHei',Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{font:inherit;cursor:pointer}
::selection{background:var(--pri-bg)}

/* ==========================================================================
   1 · 演示控制条（工具层，刻意用 AntD 中性深色，与产品 UI 明确区分）
   ========================================================================== */
.pbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:0 12px;height:var(--pbar-h);background:#141414;border-bottom:1px solid #000;
  font-size:12px;color:rgba(255,255,255,.72)}
.pbar .ptag{font:600 10.5px/1 var(--mono);background:var(--pri);color:#fff;padding:4px 7px;
  border-radius:var(--rs);letter-spacing:.04em;border:0;cursor:pointer;transition:filter .18s}
.pbar .ptag:hover{filter:brightness(1.15)}
.pbar .pbarfold{margin-left:2px;width:22px;height:20px;flex:0 0 auto;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.06);color:rgba(255,255,255,.8);border-radius:var(--rs);
  display:inline-flex;align-items:center;justify-content:center;font-size:10px;line-height:1}
.pbar .pbarfold:hover{border-color:var(--pri-h);color:#fff}
.pbar.mini > *:not(.ptag):not(.pbarfold){display:none}
.pbar.mini .ptag{margin-right:0}
.pbar .sep{width:1px;height:16px;background:rgba(255,255,255,.16)}
.pbar .lbl{color:rgba(255,255,255,.45);font-size:12px}
.pbtn{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.06);border-radius:var(--r);color:rgba(255,255,255,.85);font-size:12px;
  white-space:nowrap;transition:all .2s}
.pbtn:hover{border-color:var(--pri-h);color:#fff;background:rgba(22,119,255,.3)}
.pbtn.on{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.pbtn .n{font:600 10px/1.5 var(--mono);background:rgba(255,255,255,.18);border-radius:var(--rs);padding:0 4px}
/* Segmented（控制条版，深色） */
.pseg{display:inline-flex;align-items:center;gap:2px;padding:2px;border-radius:var(--r);
  background:rgba(255,255,255,.08)}
.pseg button{border:0;background:none;color:rgba(255,255,255,.68);padding:3px 10px;font-size:12px;
  border-radius:var(--rs);white-space:nowrap;transition:all .2s}
.pseg button:hover{color:#fff}
.pseg button.on{background:rgba(255,255,255,.22);color:#fff;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.24)}
/* Dropdown（控制条版） */
.pdrop{position:relative}
.pmenu{position:absolute;top:calc(100% + 6px);left:0;z-index:80;background:var(--elev);
  border:1px solid rgba(5,5,5,.06);border-radius:var(--rl);box-shadow:var(--sh2);padding:4px;
  min-width:296px;max-height:66vh;overflow:auto;display:none}
.pmenu.on{display:block;animation:ddin .16s ease-out}
@keyframes ddin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.pmenu .mh{font-size:12px;color:var(--t3);padding:6px 12px 3px}
.pmenu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;
  min-height:30px;padding:4px 12px;border-radius:var(--r);font-size:13px;color:var(--t1);transition:background .16s}
.pmenu button:hover{background:var(--fill)}
.pmenu button.on{background:var(--pri-bg);color:var(--pri);font-weight:500}
.pmenu button .mid{font:600 10.5px/1 var(--mono);color:var(--t3);flex:0 0 auto;width:70px}
.pmenu button.on .mid{color:var(--pri)}
.pmenu button.lk{color:var(--t3);font-size:12.5px;font-style:italic}

/* ==========================================================================
   2 · 演示引导条
   ========================================================================== */
.guide{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#141414;color:#fff;
  border-top:1px solid #000;box-shadow:0 -6px 16px rgba(0,0,0,.14);display:none}
.guide.on{display:block}
.guide .gin{display:flex;align-items:center;gap:14px;padding:10px 20px;max-width:1600px;margin:0 auto}
.guide .gstep{font:600 11.5px/1 var(--mono);background:var(--pri);padding:5px 9px;border-radius:var(--rs);flex:0 0 auto}
.guide .gtxt{flex:1;min-width:0;font-size:13px}
.guide .gtxt b{color:#69b1ff}
.guide .gbar{height:3px;background:rgba(255,255,255,.16);border-radius:2px;overflow:hidden;margin-top:6px}
.guide .gbar i{display:block;height:100%;background:var(--pri);transition:width .25s}
.guide .gbtn{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;
  padding:5px 13px;border-radius:var(--r);font-size:13px;white-space:nowrap;transition:all .2s}
.guide .gbtn:hover{border-color:var(--pri-h);background:rgba(22,119,255,.3)}
.guide .gbtn.pri{background:var(--pri);border-color:var(--pri)}
.guide .gbtn.pri:hover{background:var(--pri-h);border-color:var(--pri-h)}

/* ==========================================================================
   3 · 后台外壳（Layout：Sider + Header + Content）
   ========================================================================== */
.app{display:flex;min-height:calc(100vh - var(--pbar-h));align-items:stretch}

/* ---- 侧边菜单（浅色 · AntD Menu light inline） ---- */
.sider{width:var(--sd-w);flex:0 0 var(--sd-w);background:var(--sd);display:flex;flex-direction:column;
  border-right:1px solid var(--sd-line);position:sticky;top:var(--pbar-h);height:calc(100vh - var(--pbar-h));
  overflow:hidden;transition:flex-basis .2s,width .2s}
.app.collapsed .sider{width:var(--sd-w-c);flex-basis:var(--sd-w-c)}
.sider-logo{height:var(--hd-h);flex:0 0 var(--hd-h);display:flex;align-items:center;gap:10px;padding:0 20px;
  color:var(--t1);font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;
  border-bottom:1px solid var(--sd-line)}
.sider-logo .lg{width:28px;height:28px;flex:0 0 28px;border-radius:var(--r);background:var(--pri);
  display:flex;align-items:center;justify-content:center;font:700 12px/1 var(--mono);color:#fff;
  box-shadow:0 2px 4px rgba(22,119,255,.24)}
.app.collapsed .sider-logo{padding:0 18px}
.app.collapsed .sider-logo .lt{display:none}
.sider-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 0 40px}
.sider-nav::-webkit-scrollbar{width:6px}
.sider-nav::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:3px}
.sm-group{font-size:12px;color:var(--t3);padding:12px 20px 4px;white-space:nowrap;overflow:hidden}
.sm-item{display:flex;align-items:center;gap:10px;width:calc(100% - 16px);margin:2px 8px;text-align:left;
  border:0;background:none;height:38px;padding:0 12px;font-size:14px;color:var(--sd-t);position:relative;
  white-space:nowrap;overflow:hidden;border-radius:var(--r);transition:background .18s,color .18s}
.sm-item:hover{color:var(--t1);background:var(--sd-hover)}
.sm-item .ico{flex:0 0 16px;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;
  color:inherit;opacity:.88}
.sm-item .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sm-item .cnt{font:500 11px/1.6 var(--mono);background:var(--fill-2);border-radius:10px;padding:0 7px;color:var(--t3)}
.sm-item.on{background:var(--sd-on-bg);color:var(--sd-t-on);font-weight:500}
.sm-item.on .ico{opacity:1}
.sm-item.on .cnt{background:#fff;color:var(--pri)}
.sm-item.grp{color:var(--t1);font-weight:500}
.sm-item.grp .icow{flex:0 0 11px;width:11px;display:inline-flex;align-items:center;justify-content:center;
  color:var(--t3);transition:transform .2s}
.sm-item.grp .ico{flex:0 0 16px;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center}
.sm-item.grp:hover{color:var(--t1)}
.sm-item.grp.hason{color:var(--t1)}
.sm-item.sub{height:36px;margin-left:20px;width:calc(100% - 28px);padding-left:12px;font-size:13.5px;
  color:var(--t2)}
.sm-item.sub:hover{color:var(--t1);background:var(--sd-hover)}
.sm-item.sub.on{background:var(--sd-on-bg);color:var(--pri);font-weight:500}
.sm-item.locked{color:var(--t4);cursor:not-allowed}
.sm-item.locked:hover{color:var(--t4);background:none}
.sm-item.locked .cnt{font-family:var(--mono)}
.app.collapsed .sm-item{justify-content:center;padding:0;width:calc(100% - 16px)}
.app.collapsed .sm-item .txt,.app.collapsed .sm-item .cnt,.app.collapsed .sm-item .icow{display:none}
.app.collapsed .sm-item .ico{flex:0 0 18px;width:18px;height:18px}
.app.collapsed .sm-item.sub{height:0;overflow:hidden;opacity:0;margin:0}
.sider-foot{padding:12px 20px;border-top:1px solid var(--sd-line);font-size:12px;color:var(--t4);
  white-space:nowrap;overflow:hidden}
.app.collapsed .sider-foot{display:none}

/* ---- 主区 ---- */
.amain{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--canvas)}
/* 注意：.amain 不要加 overflow（hidden/auto/scroll 皆不可）——
   一旦成为滚动容器，其内部 .aheader 的 position:sticky 会参照它而非视口，
   表现为滚动时顶栏跟着滚走。宽表格的横向滚动由 .tblwrap 自己承担。 */
.aheader{height:var(--hd-h);flex:0 0 var(--hd-h);background:var(--panel);border-bottom:1px solid var(--line-2);
  display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:var(--pbar-h);z-index:40}
/* 校对模式开启时，顶栏与侧栏整体下移一条校对条的高度 */
body.proofing .aheader{top:calc(var(--pbar-h) + var(--proof-h))}
body.proofing .sider{top:calc(var(--pbar-h) + var(--proof-h));
  height:calc(100vh - var(--pbar-h) - var(--proof-h))}
body.proofing .toastwrap{top:calc(var(--pbar-h) + var(--proof-h) + 16px)}

/* 校对条（评审脚手架：不进产品 UI，配色与控制台一致） */
.proofbar{display:none;position:sticky;top:var(--pbar-h);z-index:58;height:var(--proof-h);
  align-items:center;gap:8px;padding:0 12px;background:#1E2530;border-bottom:1px solid #000;
  font-size:12px;color:rgba(255,255,255,.85);white-space:nowrap;overflow-x:auto}
body.proofing .proofbar{display:flex}
.proofbar::-webkit-scrollbar{height:0}
.pb-tag{font:600 10.5px/1 var(--mono);background:var(--wrn);color:#3A2A00;padding:4px 7px;
  border-radius:var(--rs);letter-spacing:.04em;flex:0 0 auto}
.pb-n{font-family:var(--mono);flex:0 0 auto}
.pb-bar{width:74px;height:4px;background:rgba(255,255,255,.16);border-radius:2px;overflow:hidden;flex:0 0 auto}
.pb-bar i{display:block;height:100%;background:var(--ok);transition:width .2s}
.pb-prog{color:rgba(255,255,255,.6);flex:0 0 auto}
.pb-sep{width:1px;height:18px;background:rgba(255,255,255,.18);flex:0 0 auto;margin:0 2px}
.pb-note{height:26px;min-width:170px;flex:1 1 170px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16);border-radius:var(--rs);color:#fff;font-size:12px;padding:0 8px}
.pb-note::placeholder{color:rgba(255,255,255,.35)}
.pb-note:focus{border-color:var(--pri-h);outline:none}
.proofbar .pbtn.on{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3)}
.pb-hint{display:inline-flex;align-items:center;gap:5px;color:#FFD591;flex:0 0 auto}
.pb-hint .pin{background:rgba(250,173,20,.2);border:1px solid rgba(250,173,20,.5);
  border-radius:var(--rs);padding:2px 6px}
/* SA 角色在切换器里单独着色，提醒「这不是常规业务角色」 */
.pseg button.sup{border-color:var(--wrn-line);color:#8A5A00}
.pseg button.sup.on{background:var(--wrn);border-color:var(--wrn);color:#fff}
/* SA 读正文时的留痕明示条 */
.saAudit{display:flex;align-items:center;gap:8px;background:var(--wrn-bg);border:1px solid var(--wrn-line);
  border-radius:var(--r);padding:8px 12px;font-size:12.5px;color:var(--t2);margin-bottom:14px}
.saAudit b{color:var(--t1)}
.collapser{width:36px;height:36px;border:0;background:none;border-radius:var(--r);color:var(--t2);
  display:flex;align-items:center;justify-content:center;transition:background .18s}
.collapser:hover{background:var(--fill);color:var(--t1)}
.aheader .crumb{flex:1;min-width:0;font-size:14px;display:flex;align-items:center;gap:0;flex-wrap:nowrap;
  overflow:hidden}
.crumb .ca{border:0;background:none;padding:2px 6px;border-radius:var(--rs);color:var(--t3);font-size:14px;
  transition:all .18s}
.crumb .ca:hover{background:var(--fill);color:var(--t1)}
.crumb .cc{color:var(--t1);padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .cs{color:var(--t4);padding:0 3px}
.aheader .ah-r{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.hicon{width:36px;height:36px;border:0;background:none;border-radius:var(--r);color:var(--t2);
  display:inline-flex;align-items:center;justify-content:center;position:relative;transition:background .18s}
.hicon:hover{background:var(--fill);color:var(--t1)}
.hicon .bdg{position:absolute;top:4px;right:3px;min-width:16px;height:16px;padding:0 4px;background:var(--dgr);
  color:#fff;font:500 10px/16px var(--mono);border-radius:10px;text-align:center;box-shadow:0 0 0 1px #fff}
.hicon.no .bdg{background:var(--t4)}
/* ---- 内容区 ---- */
.acontent{flex:1;min-width:0;padding:24px;background:var(--canvas);padding-bottom:24px}
/* 仅当页面出现「页底操作条」时，额外留白让 sticky 操作条落位到底部；
   演示引导条是 fixed 浮层，只在引导态给内容让位，不常驻 104px —— 否则操作条会浮在离底 124px 处。 */
.acontent:has(.pgfoot){padding-bottom:96px}
body.guiding .acontent{padding-bottom:104px}
.pwrap{max-width:1600px}
.pghead{margin-bottom:20px}
.pghead h2{margin:0;font-size:20px;font-weight:600;color:var(--t1);display:flex;align-items:center;gap:10px;
  flex-wrap:wrap;line-height:1.4}
.pghead h2 .pid{font:500 12px/1.7 var(--mono);background:var(--fill);color:var(--t3);
  border-radius:var(--rs);padding:0 7px}
.pghead .pdesc{margin-top:6px;font-size:14px;color:var(--t3);display:flex;align-items:center;
  gap:8px;flex-wrap:wrap}
.pghead .pdesc>span:last-child{min-width:0}
.pghead h2 svg{flex:0 0 auto}

/* ==========================================================================
   4 · Button
   ========================================================================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);
  background:var(--panel);color:var(--t1);border-radius:var(--r);padding:0 15px;font-size:14px;height:32px;
  white-space:nowrap;line-height:1;transition:all .2s;box-shadow:var(--sh-btn)}
.btn:hover{color:var(--pri-h);border-color:var(--pri-h)}
.btn:active{color:var(--pri-a);border-color:var(--pri-a)}
.btn:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:var(--sh-btn-pri)}
.btn.pri:hover{background:var(--pri-h);border-color:var(--pri-h);color:#fff}
.btn.pri:active{background:var(--pri-a);border-color:var(--pri-a)}
.btn.dgr{background:var(--panel);border-color:var(--dgr-line);color:var(--dgr);box-shadow:var(--sh-dgr)}
.btn.dgr:hover{background:var(--dgr-bg);border-color:var(--dgr);color:var(--dgr-dk)}
.btn.warn{background:var(--wrn);border-color:var(--wrn);color:#fff}
.btn.warn:hover{background:#ffc53d;border-color:#ffc53d;color:#fff}
.btn.dis,.btn:disabled{background:var(--fill-2);border-color:var(--line);color:var(--t4);cursor:not-allowed;
  box-shadow:none}
.btn.dis:hover,.btn:disabled:hover{background:var(--fill-2);border-color:var(--line);color:var(--t4)}
.btn.gh{background:none;border-color:transparent;color:var(--pri);padding:0 7px;height:auto;box-shadow:none}
.btn.gh:hover{background:var(--fill);border-color:transparent;color:var(--pri-h)}
.btn.sm{padding:0 11px;font-size:14px;height:26px;border-radius:var(--rs)}
.btn.lg{padding:0 18px;font-size:16px;height:40px}
.btnlink{border:0;background:none;color:var(--pri);font-size:13px;padding:0 3px;border-radius:var(--rs);
  line-height:1.5;transition:all .18s}
.btnlink:hover{color:var(--pri-h);background:var(--fill)}
.btnlink.dgr{color:var(--dgr)}
.btnlink.dgr:hover{color:var(--dgr-dk)}

/* ==========================================================================
   5 · Tag / 状态
   ========================================================================== */
.chip{display:inline-flex;align-items:center;gap:4px;padding:0 8px;border-radius:var(--rs);font-size:12px;
  line-height:20px;border:1px solid var(--neu-line);background:var(--neu-bg);color:var(--t2);white-space:nowrap}
.chip.c-info{border-color:var(--pri-line);background:var(--pri-bg);color:var(--pri-dk)}
.chip.c-ok{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok-dk)}
.chip.c-wrn{border-color:var(--wrn-line);background:var(--wrn-bg);color:var(--wrn-a)}
.chip.c-dgr{border-color:var(--dgr-line);background:var(--dgr-bg);color:var(--dgr-dk)}
.chip.c-pur{border-color:var(--pur-line);background:var(--pur-bg);color:var(--pur-dk)}
.chip.mono{font-family:var(--mono);font-size:11.5px}
.chip.clickable{cursor:pointer;transition:all .18s}
.chip.clickable:hover{filter:brightness(.98);box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;vertical-align:1px;margin-right:5px}
.dimchip{cursor:pointer}

/* 四维状态组 → Descriptions 风格 */
.dimrow{display:grid;grid-template-columns:112px 168px 1fr;gap:12px;align-items:baseline;
  padding:12px 0;border-bottom:1px solid var(--line-2)}
.dimrow:last-child{border-bottom:0}
.dimrow .dn{font-size:14px;color:var(--t2)}
.dimrow .dv{font-size:14px;font-weight:500}
.dimrow .dm{font-size:13px;color:var(--t3)}

/* ==========================================================================
   6 · Card
   ========================================================================== */
.sec{background:var(--panel);border:1px solid var(--line-2);border-radius:var(--rl);margin-bottom:16px}
.sec.plain{box-shadow:none}
.sec.graybg{background:var(--panel-2)}
.sec.core{border-color:var(--pri-line)}
.sec.warnb{border-color:var(--wrn-line);background:var(--wrn-bg)}
.sec.dgrb{border-color:var(--dgr-line);background:var(--dgr-bg)}
.sech{display:flex;align-items:center;gap:8px;padding:14px 20px;border-bottom:1px solid var(--line-2);
  min-height:56px;flex-wrap:wrap}
.sec.warnb>.sech{border-bottom-color:var(--wrn-line);background:rgba(255,255,255,.55)}
.sec.dgrb>.sech{border-bottom-color:var(--dgr-line);background:rgba(255,255,255,.55)}
.sech .n{font:500 12px/1.7 var(--mono);background:var(--fill);color:var(--t3);border-radius:var(--rs);padding:0 6px}
.sech .nm{font-weight:600;font-size:16px;color:var(--t1)}
.sech .ty{font-size:13px;color:var(--t3)}
.sech .flag{font-size:12px;border-radius:var(--rs);padding:0 7px;line-height:20px;border:1px solid var(--pri-line);
  background:var(--pri-bg);color:var(--pri-dk)}
.sech .flag.fix{border-color:var(--wrn-line);background:var(--wrn-bg);color:var(--wrn-a)}
.sech .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.secb{padding:20px}
.secb.tight{padding:12px 20px}

/* Descriptions 风格 kv */
.kv{display:grid;grid-template-columns:200px 1fr;gap:16px;padding:9px 0;border-bottom:1px solid var(--line-2);
  align-items:baseline}
.kv:last-child{border-bottom:0}
.kv .k{font-size:14px;color:var(--t2)}
.kv .v{font-size:14px;min-width:0;color:var(--t1);word-break:break-word}
.kv .v.mut{color:var(--t3);font-size:13px}
.kv.stack{grid-template-columns:1fr}
.kv.stack .k{margin-bottom:4px}

.ins{font-weight:600;font-size:14px;margin:16px 0 8px;padding-left:10px;border-left:3px solid var(--pri);
  color:var(--t1)}
.ins:first-child{margin-top:0}

/* Alert */
.banner{display:flex;gap:9px;align-items:flex-start;border-radius:var(--r);padding:9px 14px;font-size:13px;
  margin:8px 0;border:1px solid var(--line-2);background:var(--panel-2);color:var(--t2)}
.banner:last-child{margin-bottom:0}
.banner .bi{flex:0 0 auto;font-weight:700;font-size:13px;line-height:1.5}
.banner.info{background:var(--pri-bg);border-color:var(--pri-line);color:var(--pri-dk)}
.banner.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-dk)}
.banner.warn{background:var(--wrn-bg);border-color:var(--wrn-line);color:var(--wrn-a)}
.banner.danger{background:var(--dgr-bg);border-color:var(--dgr-line);color:var(--dgr-dk)}

.note{font-size:13px;color:var(--t3);background:var(--panel-2);border-radius:var(--r);
  padding:9px 13px;margin-top:10px;line-height:1.7}
.fixline{font-size:13px;color:var(--wrn-a);background:var(--wrn-bg);border:1px solid var(--wrn-line);
  padding:9px 13px;margin-top:8px;border-radius:var(--r);line-height:1.7}
.riskline{font-size:13px;color:var(--dgr-dk);background:var(--dgr-bg);border:1px solid var(--dgr-line);
  padding:9px 13px;margin-top:8px;border-radius:var(--r);line-height:1.7}

/* ---- 抽屉里的表单分组（AntD Form 分组标题） ---- */
.drawer.wide{width:720px}
.fgroup{margin-bottom:24px}
.fgroup>h4{margin:0 0 14px;font-size:14px;font-weight:600;color:var(--t1);display:flex;align-items:baseline;
  flex-wrap:wrap;padding-bottom:9px;border-bottom:1px solid var(--line-2)}
.radios.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0}
.radios.cards label{display:flex;flex-direction:column;gap:4px;align-items:flex-start;border:1px solid var(--line);
  border-radius:var(--r);padding:11px 13px;cursor:pointer;transition:all .18s}
.radios.cards label:hover{border-color:var(--pri-h)}
.radios.cards label.on{border-color:var(--pri);background:var(--pri-bg)}
.radios.cards label b{font-size:13.5px;color:var(--t1)}
.radios.cards label span{font-size:12px;color:var(--t3);line-height:1.6;white-space:normal}

/* ---- 列表页筛选栏（AntD Form inline 范式，筛选在表格上方） ---- */
.filterbar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.filterbar .fi{display:flex;flex-direction:column;gap:6px;min-width:132px}
.filterbar .fi.fi-w{flex:1 1 320px;min-width:260px}
.filterbar .fi>label{font-size:13px;color:var(--t2);white-space:nowrap}
.filterbar .fi .input,.filterbar .fi select.select{min-width:0;width:100%}

/* ==========================================================================
   7 · Table（AntD 表格：表头 #fafafa、行 hover #fafafa、选中 #e6f4ff）
   ========================================================================== */
.tblwrap{border-radius:var(--rl);background:var(--panel);overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl th{background:var(--panel-2);text-align:left;font-weight:600;font-size:14px;color:var(--t1);
  padding:12px 16px;border-bottom:1px solid var(--line-2);white-space:nowrap}
table.tbl td{padding:12px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle;color:var(--t1)}
table.tbl tbody tr:hover>td{background:var(--panel-2)}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tr.clk{cursor:pointer}
table.tbl tr.on>td{background:var(--pri-bg)}
table.tbl td.c,table.tbl th.c{text-align:center}
table.tbl td.r,table.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
table.tbl .mono{font-family:var(--mono);font-size:13px;color:var(--t2)}
table.tbl .go{color:var(--pri);white-space:nowrap;font-size:13px}
table.tbl tr:hover .go{color:var(--pri-h)}
table.tbl td .btnlink+.btnlink{margin-left:8px}
.prio{font:500 12px/20px var(--mono);padding:0 7px;border-radius:var(--rs);color:#fff;display:inline-block;height:20px}
.prio.p0{background:var(--dgr)}.prio.p1{background:var(--wrn)}.prio.p2{background:var(--neu)}
.tfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;
  border-top:1px solid var(--line-2);font-size:14px;color:var(--t3);background:var(--panel);flex-wrap:wrap}
.pager{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.pager .pg{min-width:28px;height:28px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);
  display:inline-flex;align-items:center;justify-content:center;color:var(--t2);padding:0 6px;transition:all .18s}
.pager .pg:hover:not(.dis){border-color:var(--pri);color:var(--pri)}
.pager .pg.on{border-color:var(--pri);color:var(--pri);background:var(--pri-bg)}
.pager .pg.dis{color:var(--t4);cursor:not-allowed}

/* ==========================================================================
   8 · Statistic
   ========================================================================== */
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.kcard{border:1px solid var(--line-2);border-radius:var(--rl);padding:16px 20px;background:var(--panel);
  cursor:pointer;transition:all .2s}
.kcard:hover{border-color:var(--pri-line);box-shadow:var(--sh)}
.kcard.on{border-color:var(--pri);background:var(--pri-bg)}
.kcard .kl{font-size:14px;color:var(--t2);display:flex;align-items:center;gap:6px}
.kcard .kv2{font-size:28px;font-weight:600;letter-spacing:-.4px;margin-top:6px;color:var(--t1);
  font-variant-numeric:tabular-nums;line-height:1.2}
.kcard .kv2 small{font-size:13px;font-weight:400;color:var(--t3);margin-left:5px;letter-spacing:0}
.kcard .kf{font-size:13px;color:var(--t3);margin-top:5px}
.kcard.warn{border-color:var(--wrn-line);background:var(--wrn-bg)}
.kcard.aux{border-color:var(--line-2);background:var(--panel-2);font-size:13px}

/* ==========================================================================
   9 · 图表占位
   ========================================================================== */
.chart{border:1px solid var(--line-2);border-radius:var(--rl);background:var(--panel);padding:16px 20px}
.bars{display:flex;align-items:flex-end;gap:8px;height:104px;padding:8px 0}
.bars .b{flex:1;background:linear-gradient(180deg,#69b1ff,#1677ff);border-radius:var(--rs) var(--rs) 0 0;position:relative}
.bars .b.dash{background:repeating-linear-gradient(135deg,#bae0ff,#bae0ff 4px,#e6f4ff 4px,#e6f4ff 8px)}
.bars .b em{position:absolute;top:-18px;left:0;right:0;text-align:center;font:500 11px/1 var(--mono);
  color:var(--t3);font-style:normal}
.funnel{display:flex;flex-direction:column;gap:6px}
.funnel .f{display:flex;align-items:center;gap:10px;font-size:13px}
.funnel .fb{height:22px;border-radius:var(--rs);background:var(--pri)}
.funnel .fv{font-family:var(--mono);font-size:13px;color:var(--t2)}

/* ==========================================================================
   10 · Form
   ========================================================================== */
.field{margin-bottom:24px}
.field>.fl{display:flex;align-items:center;gap:5px;font-size:14px;color:var(--t1);margin-bottom:8px}
.field>.fl .req{color:var(--dgr);font-weight:700;font-family:var(--mono)}
.field .fh{font-size:13px;color:var(--t3);margin-top:6px;line-height:1.6}
.field .fe{font-size:13px;color:var(--dgr);margin-top:6px}
.input,select.select,textarea.input{width:100%;border:1px solid var(--line);border-radius:var(--r);
  padding:4px 12px;font:inherit;font-size:14px;background:var(--panel);color:var(--t1);min-height:32px;
  transition:all .2s}
.input::placeholder{color:var(--t4)}
.input:hover,select.select:hover,textarea.input:hover{border-color:var(--pri-h)}
.input:focus,select.select:focus,textarea.input:focus{outline:0;border-color:var(--pri);
  box-shadow:0 0 0 2px rgba(5,145,255,.1)}
.input:disabled,textarea.input:disabled{background:var(--fill-2);color:var(--t3);cursor:not-allowed}
textarea.input{resize:vertical;min-height:72px;line-height:1.5714;padding:7px 12px}
.input.err{border-color:var(--dgr)}
.radios{display:flex;flex-wrap:wrap;gap:16px;padding:2px 0}
.radios label{display:inline-flex;align-items:center;gap:7px;font-size:14px;cursor:pointer;color:var(--t1)}
.radios input{accent-color:var(--pri);margin:0}
.checkline{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.checkline input{accent-color:var(--pri)}
.frow{display:flex;gap:16px;flex-wrap:wrap}
.frow>*{flex:1;min-width:168px}
/* Switch（AntD Switch：高 22、圆角 100px、手柄 18） */
.swt{display:inline-flex;align-items:center;gap:10px;font-size:14px}
.swt .sw{width:44px;height:22px;border-radius:100px;background:var(--pri);position:relative;
  transition:background .2s;flex:0 0 44px}
.swt .sw i{position:absolute;top:2px;left:24px;width:18px;height:18px;border-radius:50%;background:#fff;
  transition:left .2s;box-shadow:0 2px 4px rgba(0,35,11,.2)}
.swt .sw.off{background:rgba(0,0,0,.25)}
.swt .sw.off i{left:2px}

/* ==========================================================================
   11 · Tabs / Steps / Anchor
   ========================================================================== */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.tab{border:0;background:none;padding:12px 0;margin:0 20px -1px 0;font-size:14px;color:var(--t1);
  border-bottom:2px solid transparent;transition:color .2s}
.tab:hover{color:var(--pri-h)}
.tab.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:500}
.tab .tbn{font:500 11px/1.6 var(--mono);background:var(--fill);color:var(--t3);border-radius:10px;
  padding:0 7px;margin-left:8px}
.tab.on .tbn{background:var(--pri-bg);color:var(--pri-dk)}
.steps{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--t3);white-space:nowrap}
.step .sn{width:24px;height:24px;border-radius:50%;background:var(--fill-2);color:var(--t3);
  display:inline-flex;align-items:center;justify-content:center;font:500 12px/1 var(--mono);flex:0 0 24px}
.step.on{color:var(--t1)}
.step.on .sn{background:var(--pri);color:#fff}
.step.done{color:var(--t2)}
.step.done .sn{background:var(--pri-bg);color:var(--pri)}
.step .go{margin-left:4px;cursor:pointer;color:var(--pri);text-decoration:underline;font-size:13px}
.anchor{display:flex;gap:8px;flex-wrap:wrap}
.anchor button{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:2px 11px;
  font-size:13px;color:var(--t1);line-height:22px;transition:all .18s}
.anchor button:hover{border-color:var(--pri);color:var(--pri)}
.anchor button.on{border-color:var(--pri);background:var(--pri);color:#fff}

/* ==========================================================================
   12 · 左右并列对比
   ========================================================================== */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line-2);border-radius:var(--rl);
  overflow:hidden;background:var(--panel)}
.cmp>.pane{padding:16px 18px;min-width:0}
.cmp>.pane.bl{background:var(--panel-2);border-right:1px solid var(--line-2)}
.cmp>.pane.dl{background:var(--panel)}
.cmp>.pane .pl{font-size:14px;font-weight:600;color:var(--t1);margin-bottom:10px;display:flex;
  align-items:center;gap:6px;flex-wrap:wrap}
.cmp>.pane .pl .pchip{font:500 11.5px/1.7 var(--mono);background:var(--fill);color:var(--t2);border-radius:var(--rs);
  padding:0 6px}
.cmp .ln{font-size:14px;padding:7px 0;border-bottom:1px solid var(--line-2);color:var(--t1)}
.cmp .ln:last-child{border-bottom:0}
.cmp .ln.m{color:var(--t2)}
.cmp .ln.add{color:var(--ok-dk)}
.cmp .ln.del{color:var(--dgr-dk);text-decoration:line-through;text-decoration-color:var(--dgr-line)}
.cmp .ln.add::before{content:"+ ";font-weight:700}
.cmp .ln.del::before{content:"- ";font-weight:700}
.cmp .empty{color:var(--t3);font-size:14px;padding:7px 0}

/* ==========================================================================
   13 · Timeline
   ========================================================================== */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:var(--line-2)}
.tl .ti{position:relative;padding:0 0 16px}
.tl .ti:last-child{padding-bottom:0}
.tl .ti::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;
  background:var(--panel);border:2px solid var(--line)}
.tl .ti.on::before{border-color:var(--pri);background:var(--pri)}
.tl .ti.done::before{border-color:var(--ok);background:var(--panel)}
.tl .ti.warn::before{border-color:var(--wrn);background:var(--panel)}
.tl .ti .th{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--t1)}
.tl .ti .td{font-size:13px;color:var(--t2);margin-top:4px;line-height:1.7}
.tl .ti .tt{font:400 13px/1.6 var(--mono);color:var(--t3)}

/* ==========================================================================
   14 · Empty / Skeleton / Placeholder
   ========================================================================== */
.empty{text-align:center;padding:56px 24px;color:var(--t3)}
.empty .ei{width:64px;height:64px;border-radius:var(--rl);background:var(--fill);margin:0 auto 16px;
  display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--t4)}
.empty h4{margin:0 0 8px;font-size:16px;font-weight:500;color:var(--t2)}
.empty p{margin:0 0 16px;font-size:14px;color:var(--t3);line-height:1.7;max-width:620px;
  display:inline-block;text-align:left}
.empty .acts{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.sk{background:linear-gradient(90deg,rgba(0,0,0,.06) 25%,rgba(0,0,0,.15) 37%,rgba(0,0,0,.06) 63%);
  background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:var(--rs);height:16px;margin:12px 0}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.skblock{border:1px solid var(--line-2);border-radius:var(--rl);padding:20px}
.ph{background:var(--panel-2);border:1px dashed var(--line);border-radius:var(--rl);height:72px;
  display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:13px;margin:12px 0}
.reasons{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.reason{border:1px solid var(--line-2);border-radius:var(--rl);padding:16px 18px;background:var(--panel)}
.reason .rh{font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px;margin-bottom:6px;color:var(--t1)}
.reason .rb{font-size:13px;color:var(--t2);margin-bottom:12px;line-height:1.7}

/* 折叠块（用于「差异/正文已折叠，需显式预览」） */
.folded{border:1px dashed var(--line-2);border-radius:var(--rl);background:var(--panel-2);padding:15px 18px}
.folded .fd-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.folded .fd-h b{font-size:14px;color:var(--t1)}
.folded .fd-b{font-size:13px;color:var(--t3);line-height:1.8;margin-top:8px}

/* ---------------------------------------------------------------------------
   设计标注（.annot）：区块类型标签 / 页面 ID / 风险计数 / PRD 条款引用
   它们是**给评审看的依据**，不是给使用者看的信息 —— 用户第 1 条要求
   「页面不做成说明项设计」。故：默认隐藏，仅在校对模式下显示。
   这样一条规则同时解决「界面像设计说明」与「评审要能核对依据」两个诉求。
   --------------------------------------------------------------------------- */
.annot{display:none!important}
body.proofing .annot{display:inline-flex!important}
body.proofing .annot.prdref{display:inline!important}

/* 策略声明块（用于「按策略不可见」这类必须自解释的场景） */
.polnote{background:var(--pri-bg);border:1px solid var(--pri-line);border-radius:var(--rl);padding:14px 18px}
.polnote .pn-h{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--t1)}
.polnote .pn-ic{width:18px;height:18px;border-radius:50%;background:var(--pri);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;font:600 12px/1 var(--mono);flex:0 0 auto}
.polnote ul{margin:11px 0 0;padding-left:20px}
.polnote li{font-size:13.5px;line-height:1.85;color:var(--t2);margin-bottom:3px}
.polnote li b{color:var(--t1)}

<script>
/* ==========================================================================
   0 · 工具
   ========================================================================== */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function qs(id){return document.getElementById(id)}
function h(html){var d=document.createElement('div');d.innerHTML=html;return d.firstElementChild}
function clone(o){return JSON.parse(JSON.stringify(o))}
function nowStr(){var d=new Date();function p(n){return n<10?'0'+n:''+n}
  return p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())}

/* 按钮 / 交互元素构造器 */
function NAV(id,label,kind,arg,extra){
  return '<button class="btn '+(kind||'sec')+'" data-nav="'+id+'"'+
    (arg!==undefined&&arg!==null?' data-arg="'+esc(arg)+'"':'')+
    (extra?' '+extra:'')+'>'+label+'</button>'
}
function ACT(name,label,kind,arg,arg2,extra){
  return '<button class="btn '+(kind||'sec')+'" data-act="'+name+'"'+
    (arg!==undefined&&arg!==null?' data-arg="'+esc(arg)+'"':'')+
    (arg2!==undefined&&arg2!==null?' data-arg2="'+esc(arg2)+'"':'')+
    (extra?' '+extra:'')+'>'+label+'</button>'
}
function BLOCK(reason,label){
  return '<button class="btn dis" data-act="whyBlocked" data-arg="'+esc(reason)+'">'+
    (label||'批准发布')+'</button>'
}
function LNK(name,label,arg){
  return '<button class="btnlink" data-act="'+name+'"'+(arg!==undefined?' data-arg="'+esc(arg)+'"':'')+'>'+label+'</button>'
}
function NAVLNK(id,label,arg){
  return '<button class="btnlink" data-nav="'+id+'"'+(arg!==undefined?' data-arg="'+esc(arg)+'"':'')+'>'+label+'</button>'

function crumbHtml(s){
  var segs=[];
  if(s.id!=='UI-HOME-01') segs.push({label:'待办工作台',nav:'UI-HOME-01'});
  if(s.crumb){
    s.crumb.split(' › ').filter(function(x){return x&&x.trim()}).forEach(function(x,i,a){
      if(i===a.length-1) segs.push({label:x,cur:true});
      else if(MOD_HOME[x]) segs.push({label:x,nav:MOD_HOME[x]});
      else segs.push({label:x});
    });
  } else {
    var mn=MOD_HOME[s.mod];
    if(mn&&mn!==s.id) segs.push({label:s.mod,nav:mn});
    segs.push({label:s.name,cur:true});
  }
  var seen={}, out=[];
  segs.forEach(function(g){ if(g.label&&!seen[g.label]){seen[g.label]=1;out.push(g)} });
  if(out.length>1&&out[out.length-1].cur) out[out.length-1].cur=true;
  return '<div class="crumb">'+out.map(function(g,i){
    var inner = g.nav? '<button class="ca" data-nav="'+g.nav+'">'+esc(g.label)+'</button>'
                     : '<span class="'+(g.cur?'cc':'')+'">'+esc(g.label)+'</span>';
    return inner + (i<out.length-1?'<span class="mut"> › </span>':'')
  }).join('')+'</div>'
}

/* 页头操作区按角色收敛：
   PA 在「监督页」上只能刷新 —— 处置按钮（批准 / 批量标记 / 送审）对它是死胡同：
   点了也做不了事（做处置必须读正文）。这是 P5 的要害，不能只在表格里禁操作列而忘了页头。 */
/* 注意：ACTIONS 是先 var 声明再逐项挂载的，任何 ACTIONS.xxx= 都必须写在 var ACTIONS={} 之后，
   否则此时 ACTIONS 仍是 undefined（var 提升只提升声明，不提升赋值），会在启动时直接抛错。 */
function effPact(s){
  /* PA 监督视图：只给刷新；不给队列位置（「3 / 12」会泄露存在性，属侧信道） */
  if(S.role==='PA'&&s.paQueue) return ACT('paRefresh','刷新','sec');
  /* 队列内「上一条 / 下一条」原本挂在页头右区，页头改为不放按钮后并入页面级操作。
     它作用于「本页所在队列」，挂到首区块头语义正确。 */
  return (s.pact? s.pact() : (s.primary? ACT('noop','','') : '')) + qnavHtml(s)
}
/* 页底操作条：作用于「整页通栏表单 / 向导 / 决策详情」的操作用它承载。
   为什么不挂在区块头：这类操作作用于全页（提交整份修订、批准发布、走完向导），
   挂在某个区块头上会让人以为「只作用于那一块」。放在页面底部与内容合并成一条，
   用户填完自然在这里找到提交按钮 —— 这是表单页的标准范式。 */
function pgFoot(s){
  if(!s.footPact) return '';
  /* PA 监督视图（paQueue）只做监督不做处置 —— 操作条必须整条不出现，而不是禁用 */
  if(S.role==='PA'&&s.paQueue) return '';
  var body=s.footPact();
  if(!body) return '';
  return '<div class="pgfoot" id="pgFoot">'+body+'</div>'
}

/* ---------------- 校对模式（评审脚手架，非产品功能） ----------------
   与「SA 全权角色」是两件事：
     · SA  → 一个持有数据主权的全权**角色**，用来看设计全貌（含正文）
     · 校对模式 → 一个开关，让你**停在任一角色**打开任意页面，
       看「这一页在这个角色下长什么样」。校对设计时必须按角色看，
       否则会漏掉那些「本来就是刻意降级」的设计（如 PA 的正文策略块）。
   ------------------------------------------------------------------- */
var PROOF_KEY='kbproto-proof-v1';
/* 校对记录持久化：22 页的校对会跨多次刷新，存内存会丢。
   file:// 下部分浏览器会禁 localStorage，故全部 try/catch，失败则退回内存。 */
function proofLoad(){
  try{ var t=window.localStorage.getItem(PROOF_KEY);
    if(t){ var o=JSON.parse(t); if(o&&typeof o==='object') S.proofMarks=o } }catch(e){}
}
function proofSave(){
  try{ window.localStorage.setItem(PROOF_KEY, JSON.stringify(S.proofMarks)); return true }catch(e){ return false }
}
function proofIds(){ return SCREEN_ORDER.filter(function(i){return SCREENS[i].nav!==false&&!SCREENS[i].hidden}) }
function proofDone(){ return proofIds().filter(function(i){return S.proofMarks[i]&&S.proofMarks[i].m}).length }
function proofBarHtml(){
  var ids=proofIds(), cur=ids.indexOf(S.screen), n=ids.length;
  var mk=S.proofMarks[S.screen]||{};
  var sc=SCREENS[S.screen]||{};
  var seenOk=roleCanSee(S.role,S.screen);
  var rolesDiff=ROLE_ORDER.filter(function(r){return roleCanSee(r,S.screen)});
  var h='<span class="pb-tag">校对模式</span>'+
    '<span class="pb-n">第 '+(cur+1)+' / '+n+' 页 · '+esc(sc.name||'')+'</span>'+
    '<span class="pb-bar"><i style="width:'+Math.round(proofDone()/Math.max(1,n)*100)+'%"></i></span>'+
    '<span class="pb-prog">已核对 '+proofDone()+' / '+n+'</span>'+
    '<button class="pbtn" data-act="proofPrev"'+(cur<=0?' disabled style="opacity:.4"':'')+'>← 上一页</button>'+
    '<button class="pbtn" data-act="proofNext"'+(cur>=n-1?' disabled style="opacity:.4"':'')+'>下一页 →</button>'+
    '<span class="pb-sep"></span>';
  [['ok','✓ 通过'],['fix','✎ 需修改'],['skip','— 跳过']].forEach(function(x){
    h+='<button class="pbtn'+(mk.m===x[0]?' on':'')+'" data-act="proofMark" data-arg="'+x[0]+'">'+x[1]+'</button>'
  });
  h+='<input class="pb-note" id="proofNote" placeholder="备注：要改什么 / 为什么" value="'+esc(mk.note||'')+'">';
  if(!seenOk){
    h+='<span class="pb-hint"><span class="pin">当前角色 '+S.role+' 并不持有本页入口</span>'+
      '以下按 '+S.role+' 视角渲染，仅供校对版式，不代表真实可见组合</span>';
  }
  if(sc.roleDiff){
    h+='<span class="pb-hint">本页在 <span class="pin">'+rolesDiff.length+' 个角色</span>下呈现不同内容 · 逐个切：</span>'+
      rolesDiff.map(function(r){
        return '<button class="pbtn'+(S.role===r?' on':'')+'" data-act="setRole" data-arg="'+r+'">'+r+'</button>'
      }).join('');
  }
  /* 方法论护栏：这是本工具最容易用错的地方 —— 用全权视角校对会漏掉所有降级设计。
     PA 的正文策略块、被裁掉的操作列、被过滤的导航项、L4 要求「不得出现」的占位，
     在 SA 全貌视角下全都看不见。所以必须提示「按角色逐个看」。 */
  if(isSuperRole(S.role)&&sc.roleDiff){
    h+='<span class="pb-hint"><span class="pin">当前是 SA 全貌视角</span>'+
      '会遮蔽降级设计，请切 DEV/TL/KM/PA 逐个核对</span>';
  }
  h+='<span class="pb-sep"></span>'+
    '<button class="pbtn" data-act="proofExport">导出校对记录</button>'+
    '<button class="pbtn" data-act="proofReset" title="清空全部标记">清空</button>'+
    '<button class="pbtn" data-act="proofExit">退出校对</button>'+
    /* 只在「确实尝试过保存」之后才显示状态 —— 否则一上来就写「仅存内存」
       会让人以为本地存储被禁用了，其实只是还没发生写入。 */
    (S.proofSaved===true? '<span class="pb-prog" style="margin-left:2px">已自动保存</span>'
      : S.proofSaved===false? '<span class="pb-prog" style="margin-left:2px;color:#FFD591">仅存内存（无法写入本地存储）</span>'
      : '<span class="pb-prog" style="margin-left:2px;color:rgba(255,255,255,.4)">改动会自动保存</span>');
  return h
}
function renderProof(){
  var b=qs('proofbar'); if(!b) return;
  document.body.classList.toggle('proofing',!!S.proofOn);
  if(S.proofOn) b.innerHTML=proofBarHtml(); else b.innerHTML='';
  var nt=qs('proofNote');
  if(nt) nt.oninput=function(){
    var m=S.proofMarks[S.screen]||(S.proofMarks[S.screen]={});
    m.note=nt.value; S.proofSaved=proofSave();
  };
  var btn=qs('proofBtn'); if(btn) btn.classList.toggle('on',!!S.proofOn);
}

ACTIONS.proofMark=function(el,a){
  var m=S.proofMarks[S.screen]||(S.proofMarks[S.screen]={});

ACTIONS.proofExport=function(){
  var ids=proofIds(), lines=['# 原型逐页校对记录','','生成时间：'+nowStr()+'',''];
  lines.push('| # | 页面 | 页面 ID | 结论 | 备注 |','|---|---|---|---|---|');
  var nOk=0,nFix=0,nSkip=0,nNone=0;
  ids.forEach(function(id,i){
    var m=S.proofMarks[id]||{};
    var t=m.m==='ok'?'✓ 通过':(m.m==='fix'?'✎ 需修改':(m.m==='skip'?'— 跳过':'（未核对）'));
    if(m.m==='ok')nOk++; else if(m.m==='fix')nFix++; else if(m.m==='skip')nSkip++; else nNone++;
    lines.push('| '+(i+1)+' | '+(SCREENS[id].name)+' | '+id+' | '+t+' | '+(m.note||'')+' |');
  });
  lines.push('','合计：通过 '+nOk+' · 需修改 '+nFix+' · 跳过 '+nSkip+' · 未核对 '+nNone,'');
  lines.push('> 本表由原型的「校对模式」导出（评审脚手架，非产品功能）。');
  var txt=lines.join('\n');
  try{
    var b=new Blob([txt],{type:'text/markdown;charset=utf-8'});
    var u=URL.createObjectURL(b); var a=document.createElement('a');
    a.href=u; a.download='原型逐页校对记录.md';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},800);
    toast('已导出校对记录：原型逐页校对记录.md','ok',4200)
  }catch(e){ toast('当前环境不支持下载；记录仍保留在原型内存中','warn',3800) }
};

/* 评审脚手架：角色 × 页面授权矩阵（非产品功能，只用于评审时核对授权设计） */
/* --------------------------------------------------------------------------
   PA 监督视图：平台管理员进「队列页」只看规模与元数据，不看内容、不做处置。
   为什么给队列不给详情：队列页上「监督」这个任务能被完整完成；
   详情页必须读正文才能判，而 L5 禁止 PA 读正文 → 那才是死胡同。
   列白名单：可显示 条目ID / 领域 / 类型 / 来源仓库 / 时间 / 等待时长 / 优先级 / 状态 / 负责人；
   必须省略 标题 / 摘要 / 正文 / 命中片段 / 适用条件 / 争议点 / 审核意见（不渲染，不是打码）。
   -------------------------------------------------------------------------- */
function polnote(title,items){
  return '<div class="polnote"><div class="pn-h"><span class="pn-ic">ⓘ</span><b>'+title+'</b></div>'+
    '<ul>'+items.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div>'
}
function paSupervise(o){
  var agg=o.agg||[];
  return sec('平台管理员监督视图','策略声明',
      polnote(o.polTitle||'这里是监督视图 —— 你能看规模与元数据，看不到内容，也不做处置',
        o.polItems||[
          '<b>为什么</b>：你当前是 PA（平台管理员）。平台管理权限 ≠ 知识内容访问权<span class="prdref annot">（§2.1）</span>。',
          '<b>少了什么</b>：'+ (o.hidden||'标题、正文、争议点、审核意见') +' 一律不渲染 —— 不是打码，是不加载。',
          '<b>为什么不做处置</b>：'+(o.whyNoAction||'审核与裁决必须读正文才能判，而这个角色读不到正文。给你按钮会变成「点了也没用」。'),
          '<b>要看某一条</b>：走「以 KM 视角预览」，一次一条、写入审计。'
        ])+
      (agg.length? '<div class="kgrid" style="margin-top:14px">'+agg.map(function(a){
        return '<div class="kcard"><div class="kl">'+a[0]+'</div><div class="kv2">'+a[1]+'</div>'+
          '<div class="kf">'+a[2]+'</div></div>'}).join('')+'</div>' : ''),
      {n:'1'})+
    sec(o.title||'队列（元数据）','表格',
      tbl(o.head,o.rows,{foot:'<span>'+o.foot+'</span>'+
        '<span class="rowflex" style="gap:10px">'+pager(o.rows.length,1,1,10)+
        '<span class="small mut">10 条/页</span></span>'})+
      note(o.note||'本表刻意不含标题与正文列 —— 可按 ID 与元数据排序、统计积压，但无法据此判断内容对错。'),
      {n:'2',cls:'graybg'})
}

  clearDrawers();

  S.cand=true;

  document.body.appendChild(mk);

    ['领域知识','本业务域内可复用的结论与经验'],
    ['项目规则','单仓库 / 单项目的约定'],
    ['个人实践','尚未验证的个人经验，默认仅本人可见']];

    '<div class="dh"><h3>提交知识候选</h3><span class="chip c-info">手动提交</span>'+
      '<span class="small mut">只有 3 项必填：分级 / 标题 / 结论</span>'+
      '<button class="btn gh sm" data-act="closeDrawers">✕</button></div>'+
    '<div class="db">'+
      '<div class="fgroup"><h4>知识分级 <span class="req">*</span>'+
        '<span class="small mut" style="font-weight:400;margin-left:8px">决定它进入谁的知识库、由谁审核</span></h4>'+
        '<div class="radios cards">'+LV.map(function(x,i){
          return '<label class="'+(lv===i?'on':'')+'" data-act="candLv" data-arg="'+i+'">'+
            '<b>'+x[0]+'</b><span>'+x[1]+'</span></label>'}).join('')+'</div></div>'+
      '<div class="fgroup"><h4>适用范围</h4>'+
        '<div class="frow">'+
          '<div class="field" style="margin-bottom:0"><div class="fl">业务域</div>'+
            '<input class="input" value="'+esc(scope().domain)+'" readonly style="background:var(--fill-2)">'+
            '<div class="fh">取自当前全局上下文，不用填</div></div>'+
          '<div class="field" style="margin-bottom:0"><div class="fl">仓库</div>'+
            '<input class="input" value="'+esc(scope().repo)+'" readonly style="background:var(--fill-2)">'+
            '<div class="fh">取自当前上下文，可切顶栏换</div></div>'+

        '</div></div>'+
      '<div class="fgroup"><h4>知识内容</h4>'+
        '<div class="field"><div class="fl">标题 <span class="req">*</span></div>'+
          '<input class="input" id="candTitle" placeholder="一句话说清结论，不描述背景">'+
          '<div class="fh">好标题 = 别人不用点开就知道这条讲什么。反例：「关于列宽的一点问题」。</div></div>'+
        '<div class="field"><div class="fl">结论 <span class="req">*</span></div>'+
          '<textarea class="input" id="candClaim" placeholder="可直接照做的结论，例如：在已验证环境下，显式设置列宽可解决该复现用例的问题。"></textarea>'+
          '<div class="fh">只写结论，不写排查过程。带条件的话请写到下方「适用条件」。</div></div>'+
        '<div class="field"><div class="fl">适用条件</div>'+
          '<input class="input" id="candCond" placeholder="例如：table-component 1.2.3 · 启用文本省略 · prod">'+
          '<div class="fh">写清「什么情况下成立」。缺这一项，别人不知道能不能照用。</div></div>'+
        '<div class="field"><div class="fl">缺失代价</div>'+

      '</div>'+
      '<div class="fgroup"><h4>来源与材料</h4>'+

  f.onchange=function(){ if(f.files&&f.files[0]){ S.candFile=f.files[0].name; candDrawer(true);
    toast('已选择文件：'+S.candFile,'ok',3200) } };

};
ACTIONS.candTpl=function(){
  var md=['# 知识候选提交模板','','## 知识分级','（团队规范 / 领域知识 / 项目规则 / 个人实践 四选一）','',
    '## 标题','（一句话说清结论）','','## 结论','（可直接照做的结论，不写排查过程）','',
    '## 适用条件','（什么版本、什么环境、什么前提下成立）','',
    '## 缺失代价','（选填：不知道这条会多花什么代价）','','## 来源说明','（这条经验从哪来）',''].join('\n');
  try{
    var b=new Blob([md],{type:'text/markdown;charset=utf-8'});
    var u=URL.createObjectURL(b);
    var a=document.createElement('a'); a.href=u; a.download='知识候选提交模板.md';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},800);
    toast('已下载模板：知识候选提交模板.md','ok',4200)
  }catch(e){ toast('当前环境不支持下载，可直接填写表单','warn',3600) }
};

ACTIONS.c1submit=function(){
  var gv=function(id){var e=qs(id);return e&&e.value?e.value.trim():''};
  var title=gv('candTitle')||'（未填写标题）';
  var claim=gv('candClaim')||'（未填写结论）';
  var cond=gv('candCond')||'未标注';
  var cost=gv('candCost')||'—';
  var evs=gv('candEv')||'—';
  var lv=(S.candLv===undefined?1:S.candLv);
  var lvName=['团队规范','领域知识','项目规则','个人实践'][lv];
  var n=++M.seq, id='CT-000'+n;
  M.submissions.unshift({id:id,dispo:'needs_confirmation',status:'待补充确认',time:nowStr(),
    src:'手动提交',lv:lvName,sum:claim.slice(0,24),cond:cond,title:title,
    self:{discoverability:'missing_context',priority:'P0'},
    server:{dispo:'待补充确认',sum:'已完成合理检查，缺少必要的因果依据；增量断言未绑定证据，标记为 inconclusive。',
      reason:'需补充：该结论的适用版本范围及其来源。',rule:'r7'},
    tl:[{t:nowStr(),h:'提交',d:'dev-b'},{t:nowStr(),h:'服务端接收',d:'accepted（accept ≠ 已发布）'},
      {t:'—',h:'等待异步提炼',d:'',on:true}]});
  M.todos.unshift({id:'T'+M.seq,type:'待补充',obj:id,wait:'刚刚',prio:'P1',owner:'me',
    reason:'增量缺证据',kind:'contrib',go:{id:'UI-CONTRIB-03',arg:id},d:'待补充'});
  S.cand=false; S.candFile=null;
  clearDrawers();
  toast('提交成功 · 已生成候选 <b>'+id+'</b>（'+lvName+'），进入审核队列','ok',4600);
  go('UI-CONTRIB-02',null,true)
};

   ========================================================================== */
document.addEventListener('click',function(e){
  var t=e.target;
  if(!t||!t.closest) return;
  var hm=t.closest('[data-mask]');
  if(hm&&t===hm){closeOverlay();return}
  if(!t.closest('.pmenu')&&!t.closest('.pdrop')&&!t.closest('.dd')) closeMenus();
  var b=t.closest('[data-act]');
  if(b){
    _evEl=b;                                  /* 供 S02 就地确认定位锚点 */
    var nm=b.getAttribute('data-act'), a=b.getAttribute('data-arg'), a2=b.getAttribute('data-arg2');
    if(ACTIONS[nm]){e.preventDefault();ACTIONS[nm](b,a,a2)} else {console.warn('未绑定动作:',nm)}
    return
  }
  var n=t.closest('[data-nav]');
  if(n){
    e.preventDefault();
    if(n.classList.contains('locked')){ACTIONS.denyModule(n,n.getAttribute('data-arg'));return}
    go(n.getAttribute('data-nav'),n.getAttribute('data-arg')||null)
  }
});
document.addEventListener('keydown',function(e){
  var tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select'){ if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();var go2=document.querySelector('[data-act="rvPublish"],[data-act="c1submit"],[data-act="subFeedback"]');
      if(go2)go2.click()} return }
  if(e.metaKey||e.ctrlKey){ if(e.key==='k'){e.preventDefault();go('UI-KB-01','q')} return }
  /* 斜杠聚焦检索框（后台惯例）：聚焦后不再拦截后续输入 */
  if(e.key==='/'){
    var si=document.getElementById('kbQ');
    if(si){ e.preventDefault(); si.focus(); try{si.select()}catch(_e){} return }
  }
  var k=e.key.toLowerCase();
  if(k==='escape'){closeOverlay();closeMenus();
    /* 三类抽屉都要能被 Esc 关闭：风险 / 页面地图 / 提交候选（曾漏掉第三类） */
    if(S.riskPanel||S.mapPanel||S.cand){ACTIONS.closeDrawers()} return}
  if(k==='h'||k==='?'){e.preventDefault();ACTIONS.help();return}
  if(k==='w'){e.preventDefault();ACTIONS.togHotspot(qs('togHotBtn'));return}
  if(k==='r'){e.preventDefault();ACTIONS.togRisk();return}
  if(k==='d'){e.preventDefault();ACTIONS.dimLegend();return}
  if(k==='n'){e.preventDefault();var n=document.querySelector('.pbar [data-act="flowMenu"]');if(n)n.click();return}
  if(k==='p'){e.preventDefault();var p=document.querySelector('[data-act="jumpMenu"]');if(p)p.click();return}
  if(k==='j'||k==='arrowdown'||k==='k'||k==='arrowup'){
    /* 只在本角色可访问的屏幕间翻页，避免连续撞上权限墙 */
    var ord=SCREEN_ORDER.filter(function(id){return navAllowed(SCREENS[id])});
    var i=ord.indexOf(S.screen); if(i<0)i=0;
    i=(k==='j'||k==='arrowdown')?(i+1)%ord.length:(i-1+ord.length)%ord.length;
    e.preventDefault();go(ord[i],null,true);return
  }
});

function revMissing(){
  var R=M.kbRevision||{}, m=[], d=R.defaults||{};
  if(R.submitted) return [];
  /* 读值策略：DOM 值优先（反映用户当前输入），读不到则回退到状态里的初值。
     为什么必须回退：footPact() 在 innerHTML 替换**之前**执行，首屏渲染时表单元素还不存在，
     只读 DOM 会把「已预填的字段」全部误判为缺失（真实浏览器实测到的 bug，mock DOM 测不出来）。 */
  var g=function(id,fb){
    var e=null;
    try{ e=document.getElementById(id) }catch(_e){}
    /* 元素存在 → DOM 是唯一真相（哪怕为空）：否则「用户主动清空」会被默认值复活，永远发现不了缺失。
       元素不存在（首屏尚未渲染出来）→ 才回退到状态初值。 */
    if(e && typeof e.value==='string') return (e.value||'').trim();
    return String(fb===undefined?'':fb).trim()
  };
  if(!g('rvTitle', R.title||d.rvTitle)) m.push('标题');
  if(!g('rvClaim', R.claim||d.rvClaim)) m.push('结论');
  if(!g('rvCond',  R.cond||d.rvCond))   m.push('适用条件');
  if(!g('rvSource',R.source||d.rvSource)) m.push('来源定位');
  return m
}

function rvState(arg){
  var key=arg&&M.review02[arg]?arg:'K-000123';
  var R=M.review02[key];
  if(!R) R=M.review02['K-000123'];
  if(!R.bound) R.bound=[true,true,false];
  if(!R.ck) R.ck={};
  if(!R.coll) R.coll={};
  return R
}
function rvMissing(){
  var R=rvState(S.screen==='UI-REVIEW-02'?S.arg:null);
  var m=[];
  if(!R.bound[2]) m.push('证据绑定 1 项（「其他版本是否同样适用」仅推断）@UI-REVIEW-02#4');
  if(!R.ck[3]) m.push('逐项确认 ④「是否应改为链接」未选@UI-REVIEW-02#8');
  if(!R.ck[4]) m.push('逐项确认 ⑤「能否转为可执行约束」未选@UI-REVIEW-02#8');
  return m
}

ACTIONS.govSubmit=function(){
  var C=M.conflict, r=qs('govReason'); if(r) C.reason=r.value;
  if(!C.decision){toast('请先选择处置','warn');return}
  if(!(C.reason||'').trim()){toast('理由为必填项','warn');return}
  var isW=C.decision==='withdraw';
  var opts={title:isW?'撤回并发布替代条目':'提交裁决',
    desc:isW? '本条为不可逆的高危操作：撤回后普通视图不再返回该条目正文，并向所有已知引用者发送更正提示。'
      : '裁决将写入审计日志，并同步到相关条目的状态与血缘关系。',
    impact:isW? ['向 '+C.refsB.length+' 位已知引用者（'+C.refsB.join('、')+'）发送站内更正提示',
      '该条目检索开关置为 suspended，正文不再返回',
      '生成替代条目并保留来源关系（血缘不断开）',
      '撤回无法抹除引用者已产生的本地输出'] : ['裁决结论写入审计日志',
      '两条目按「条件不同、结论不同」独立保留，并建立版本关系'],
    reasonRequired:isW, reasonPh:isW?'请写明撤回依据':'',
    doubleCheck:isW?'我已确认影响面，理解撤回不可逆':null,
    ok:isW?'确认撤回并发布替代':'确认提交裁决',
    onOk:function(){
      if(isW){ M.kb[C.b]&&(M.kb[C.b].st.serve='suspended');
        M.notifications.unshift({t:'站内更正提示',b:'两条目冲突已裁决：'+C.b+' 已撤回并发布替代条目。',d:'需要我动作'}) }
      M.audit.unshift({t:nowStr(),who:ROLES[S.role].who,act:isW?'撤回':'裁决',tgt:C.b,
        rc:isW?'conflict_withdrawn':'conflict_resolved',rid:'req-'+Math.random().toString(16).slice(2,8),r:'成功'});
      M.todos=M.todos.filter(function(t){return t.kind!=='gov'});
      closeOverlay();render();
      toast((isW?'已撤回并发布替代：':'已提交裁决：')+
        ({keep:'保留独立',version:'建立版本关系',conflict:'标记冲突并暂停检索',withdraw:'撤回并替代'}[C.decision])+
        ' · 冲突待裁决已从工作台消失','ok',5200)
    }};
  if(isW) confirmS('S01',opts); else confirmS('S02',opts)
};

function renderCfgWizard(C){

  var stepsHtml='<div class="steps">'+st.map(function(s,i){

  var body='';
  if(C.wizard===1){
    body=sec('第 1 步 · 接入信息（身份 + 地址合屏）','表单',
      '<div class="field"><div class="fl">身份提供方</div><select class="select"><option>企业 SSO · OIDC</option></select></div>'+
      '<div class="field"><div class="fl">知识服务地址</div><input class="input" value="https://kb.internal.example.com">'+
        '<div class="rowflex" style="margin-top:5px">'+ACT('cfgCheck','连通性检查（内联）','sec')+
        chip('✓ 连通性正常 · 142ms','c-ok')+'</div></div>'+
      note('原来第 1、2 步要分屏填写，现在合屏 —— 中途不必回退重填。'),
      {n:'1'})
  } else if(C.wizard===2){
    body=sec('第 2 步 · 映射与人群（合屏）','表格',
      tbl(['仓库','业务域','有效上下文',''],
        C.maps.map(function(m){
          return [{v:'<span class="mono">'+m.repo+'</span>'},{v:m.dom},
            {v:m.ctxOk? chip('已选：'+m.ctx,'c-ok') : chip('需显式选择 ⚠','c-dgr')},
            {v:m.ctxOk? ACT('cfgEdit','编辑','gh',m.repo) : ACT('cfgCtxPick','选择','pri',m.repo)}]
        }))+
      '<div class="field" style="margin-top:9px"><div class="fl">授权人群配置</div>'+
        '<div class="rowflex">'+chip('引用：team-a 全域 · ads 域','c-info')+'</div></div>'+
      note('一仓库多业务域时必须在这里显式选择有效上下文，不能靠名称猜。'),
      {n:'2'})
  } else {
    var invalid=C.maps.filter(function(m){return !m.ctxOk});
    body=sec('第 3 步 · 发布前校验清单','操作区',
      kyberRow('接入信息完整性','<span class="chip c-ok">✓ 已通过</span>')+
      kyberRow('连通性','<span class="chip c-ok">✓ 正常</span>')+
      kyberRow('映射有效上下文', invalid.length? '<span class="chip c-dgr">✗ '+invalid.length+' 个仓库未选择</span>'
        : '<span class="chip c-ok">✓ 全部已选择</span>')+
      kyberRow('权限映射一致性', invalid.length? '<span class="chip c-wrn">待校验</span>' : '<span class="chip c-ok">✓ 已校验</span>')+
      (invalid.length? '<div class="needlist"><div class="b">还缺这些：</div><ul>'+
        invalid.map(function(m){return '<li>'+m.repo+' 的有效上下文未选择</li>'}).join('')+'</ul></div>'
        : ban('ok','校验通过，可以发布。'))+
      note('发布前把清单摊开 —— 避免走到最后一步才发现缺项、被迫回退重填。'),
      {n:'3'})
  }
  return sec('三步接入向导','工具条',
      stepsHtml+'<div class="rowflex" style="margin-top:9px">'+
        (C.wizard>1? ACT('cfgPrev','← 上一步','sec'):'')+
        (C.wizard<3? ACT('cfgWizard','下一步（'+st[C.wizard]+'）','pri') : ACT('cfgWizard','发布配置版本','pri'))+
        ACT('cfgExitWizard','退出向导','gh')+'</div>'+
      note('首次接入由 5 步压到 <b>3 步</b>；每一步都能上一步返回且不丢已填内容。'),
      {n:'',cls:'core',flag:['fix','3 步']})+body
}

SCREEN({
  id:'UI-IAM-03',name:'审计日志',mod:'M8 身份与权限',ni:'23',route:'/iam/audit',

  fixes:['页面固定标注「追加日志用于追踪，不宣称具备不可篡改保证」',

  exits:[['UI-IAM-01','用户与角色'],['UI-IAM-02','范围授权']],
  /* 与筛选条内的「查询 / 重置 / 导出」重复 → 删除 */

    var sel=S.auSel||M.audit[0];
    return sec('检索筛选条','筛选栏',
        '<div class="rowflex">'+['时间范围：近 30 天 ▾','actor：全部 ▾','action：全部 ▾','target_id ▾','reason_code：全部 ▾']

          ACT('auExport','导出（需确认）','dgr')+'</div>',
        {n:'1',tight:1})+
      '<div class="grid2 a">'+
        sec('日志表格','表格',
          tbl(['时间','actor','action','target_id','reason_code','request_id','结果'],
            M.audit.map(function(a){
              return {_cls:'clk'+(sel&&a.rid===sel.rid?' on':''),
                _attr:'data-act="auPick" data-arg="'+a.rid+'"',
                cells:[a.t,a.who,'<b>'+a.act+'</b>','<span class="mono small">'+a.tgt+'</span>',
                  '<span class="mono small">'+a.rc+'</span>','<span class="mono small">'+a.rid+'</span>',
                  a.r==='成功'?'<span class="chip c-ok">成功</span>':'<span class="chip">'+a.r+'</span>']}
            }),
            {foot:'<span>共 1,284 条</span>'+
              '<span class="rowflex" style="gap:10px">'+pager(1284,1,26,50)+'<span class="small mut">50 条/页</span></span>'+
              '<span class="small mut">导出受团队策略约束</span>'})+
          ban('warn','追加日志用于追踪，<b>不宣称普通 Git 日志具备不可篡改保证</b><span class="prdref annot">（§10.4）</span>。')+
          '',
          {n:'2'})+
        sec('日志详情','侧栏',
          sel? kyberRow('时间',sel.t+' · 14 秒（示例）')+
            kyberRow('actor',esc(sel.who))+
            kyberRow('action','<b>'+esc(sel.act)+'</b>')+
            kyberRow('target_id','<span class="mono">'+esc(sel.tgt)+'</span> '+
              NAV('UI-KB-02','跳转对象','gh',/^K-/.test(sel.tgt)?'K-000123':null))+
            kyberRow('reason_code','<span class="mono small">'+esc(sel.rc)+'</span>')+
            kyberRow('request_id','<span class="mono small">'+esc(sel.rid)+'</span>')+
            kyberRow('结果',esc(sel.r))+
            kyberRow('备注','遗留的最小审计记录不保留已删除的敏感正文')+
            '<div class="rowflex" style="margin-top:9px">'+NAV('UI-KB-02','跳转目标对象','sec')+'</div>'
          : '<div class="small mut">点击左侧任意一行查看详情。</div>',
          {n:'3',cls:'graybg'})+
      '</div>'
  }
});
